[package]
name = "skymemory-database"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "mysql", "postgres"] }
tracing = "0.1"
