[package]
name = "skymemory-embedding"
version = "0.2.0"
edition = "2021"

[dependencies]
skymemory-core = { path = "../core" }
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = "0.21"
image = "0.25"
reqwest = { version = "0.12", features = ["rustls-tls", "blocking"], default-features = false }
tokio = { version = "1", features = ["fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
tracing = "0.1"
parking_lot = "0.12"
