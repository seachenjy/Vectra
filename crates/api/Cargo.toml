[package]
name = "skymemory-api"
version = "0.2.0"
edition = "2021"

[dependencies]
skymemory-core = { path = "../core" }
skymemory-vector = { path = "../vector" }
skymemory-graph = { path = "../graph" }
skymemory-property = { path = "../property" }
skymemory-temporal = { path = "../temporal" }
skymemory-query = { path = "../query" }
skymemory-backup = { path = "../backup" }
skymemory-import-export = { path = "../import_export" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = "1.0"
tracing = "0.1"
parking_lot = "0.12"
