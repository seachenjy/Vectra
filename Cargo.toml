[workspace]
members = [
    "crates/core",
    "crates/storage",
    "crates/vector",
    "crates/graph",
    "crates/property",
    "crates/temporal",
    "crates/query",
    "crates/api",
    "crates/import_export",
    "crates/backup",
]
resolver = "2"

[package]
name = "skymemory"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "skymemory"
path = "src/main.rs"

[dependencies]
skymemory-core = { path = "crates/core" }
skymemory-storage = { path = "crates/storage" }
skymemory-vector = { path = "crates/vector" }
skymemory-graph = { path = "crates/graph" }
skymemory-property = { path = "crates/property" }
skymemory-temporal = { path = "crates/temporal" }
skymemory-query = { path = "crates/query" }
skymemory-api = { path = "crates/api" }
skymemory-import-export = { path = "crates/import_export" }
skymemory-backup = { path = "crates/backup" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
